<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản trị · Dương & Ngân</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><main class="admin"><a href="/">← Về thiệp cưới</a><h1>Góc của Dương & Ngân</h1><form id="login" class="paper"><label>Mật khẩu quản trị<input name="password" type="password" autocomplete="current-password" required></label><button type="submit" class="button">Đăng nhập</button></form><p id="status" role="status"></p><section id="dashboard" hidden><p id="summary"></p><div class="actions"><button id="export">Xuất xác nhận CSV</button><button id="refresh">Tải lại</button><button id="logout">Đăng xuất</button></div><details><summary>Chỉnh sửa thông tin & album</summary><p>Sửa nội dung JSON bên dưới. Ảnh dùng đường dẫn trong repo hoặc URL HTTPS. Không nhập danh sách khách vào nội dung công khai.</p><textarea id="content-editor" rows="20" aria-label="Nội dung thiệp cưới"></textarea><button id="save-content">Lưu nội dung</button></details><h2>Xác nhận & lời chúc</h2><div class="table-wrap"><table><thead><tr><th>Tên</th><th>Loại</th><th>Tham dự</th><th>Số người</th><th>Nội dung</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></body></html>
